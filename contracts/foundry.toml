[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The fork suite is excluded from the default run: it needs the network, and it needs ffi to make
# a real P-256 signature for the passkey path. Run it deliberately:
#
#     FOUNDRY_PROFILE=live forge test --match-path test/Live.t.sol -vv
no_match_path = "test/Live.t.sol"

[profile.live]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = true
# Profiles inherit from default, so the exclusion above has to be lifted here by hand.
no_match_path = "test/nothing"
fs_permissions = [{ access = "read", path = "./script" }]
# Base has the RIP-7212 P-256 precompile at 0x100; foundry's EVM does not turn it on by default,
# and without this the passkey path silently fails closed in the fork exactly as it would on a
# chain that lacks it. Verified separately against live Base: the same signature returns 1 there.
odyssey = true
